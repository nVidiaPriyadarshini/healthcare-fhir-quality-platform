services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: fhir_quality
      POSTGRES_USER: fhir
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-dev-only}
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fhir -d fhir_quality"]
      interval: 5s
      timeout: 3s
      retries: 10
  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://fhir:${POSTGRES_PASSWORD:-local-dev-only}@db:5432/fhir_quality
    ports: ["8000:8000"]
    depends_on:
      db:
        condition: service_healthy
  frontend:
    build: ./frontend
    ports: ["5173:80"]
    depends_on: [api]
volumes:
  postgres_data:
